{% extends 'railway/base.html' %}

{% block content %}
  <h2>Raise a Query</h2>

  <!-- Display success or error messages -->
  {% if messages %}
    <div class="alert alert-info">
      {% for message in messages %}
        <p>{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}
  
  <form method="POST" action="{% url 'raise_query' %}">
    {% csrf_token %}
    
    <div class="form-group">
      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" class="form-control" required><br>
    </div>

    <div class="form-group">
      <label for="subject">Subject:</label>
      <input type="text" id="subject" name="subject" class="form-control" required><br>
    </div>

    <div class="form-group">
      <label for="message">Message:</label>
      <textarea id="message" name="message" class="form-control" required></textarea><br>
    </div>

    <button type="submit" class="btn btn-primary">Submit Query</button>
  </form>

  <!-- Link to go back to home -->
  <div align="center">
    <form action="{% url 'home' %}" method="get">
        <button type="submit" style="padding: 10px 20px; background-color: #4CAF50; color: white; border: none; cursor: pointer;">Go to Home Page</button>
    </form>
</div>
{% endblock %}
